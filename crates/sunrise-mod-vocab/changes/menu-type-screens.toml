ids = ["hook:screen", "hook:screen_draw", "hook:screen_click", "hook:screen_tooltip", "method:prelude::ScreensClientHost::screen_slot", "method:prelude::ScreensClientHost::set_screen_slot"]
why = "A screen goes with its menu type, whatever opened the menu, so a mod menu opened without a block gets one too: the four hooks are MenuPart methods keyed by the new event.menu, and event.block is an Option. screen_slot and set_screen_slot name the open screen by its menu type for the same reason."
migrate = "Move screen, screen_draw, screen_click and screen_tooltip from the block's BlockEntityPart to a MenuPart attached with r.menu_part(<the block's menu type>, part). event.block is Some(the mod block at the menu's position whose container opens that menu type), else None, as for most menus opened with player_open_mod_menu. Pass the menu type, not the block, to host.screen_slot and host.set_screen_slot. One MenuPart answers a menu type's screen hooks (one per mod on a vanilla type, asked only for that mod's blocks): fold a second into it."

[package]
name = "sunrise-game"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The game as the platform runs it: the engine's entry with the platform's parts registered, for an executable to start (docs/layers.md)"

[dependencies]
sunrise-guest-stack = { path = "../sunrise-guest-stack" }
sunrise-client = { path = "../sunrise-client", default-features = false }
sunrise-mod-package = { path = "../sunrise-mod-package", default-features = false, features = ["index"] }

sunrise-mod-host = { path = "../sunrise-mod-host", default-features = false }

[lints]
workspace = true

# The binary holds no tests (the library does): `cargo test` builds no empty test harness for it, which linked the
# whole crate again. It still builds for integration tests (CARGO_BIN_EXE_*) and clippy --all-targets.
[[bin]]
name = "sunrise-client"
path = "src/main.rs"
test = false

[features]
default = ["audio", "controllers", "friends", "extension-points"]
audio = ["sunrise-client/audio"]
controllers = ["sunrise-client/controllers"]
extension-points = ["sunrise-client/extension-points"]
testing = ["sunrise-client/testing"]
friends = ["sunrise-client/friends"]
rng-trace = ["sunrise-client/rng-trace"]
system-allocator = ["sunrise-client/system-allocator"]
alloc-census = ["sunrise-client/alloc-census"]
alloc-count = ["sunrise-client/alloc-count"]
windows-mimalloc = ["sunrise-client/windows-mimalloc"]
windows-segment-heap = ["sunrise-client/windows-segment-heap"]

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
sunrise-protocol = { path = "../sunrise-protocol" }
tempfile = "3"
sunrise-core = { path = "../sunrise-core" }
serde_json = "1"

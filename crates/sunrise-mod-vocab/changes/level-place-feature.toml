ids = ["handle:LevelRef::place_feature", "type:PlaceFeatureRefusal"]
why = "Adds LevelRef::place_feature: a server mod places a worldgen/configured_feature by id at a position, as /place feature does (PlaceCommand.placeFeature: ConfiguredFeature.place with the level's random and generator, after checkLoaded over the 3x3 chunks). Ok(true) placed, Ok(false) ran and found no room; each refusal is named by PlaceFeatureRefusal (Stale, Client, NotInPlace, NotLoaded, UnknownFeature) and changes nothing. Tinkers' Construct's island trees and ender-tree propagules needed it; mods had no way to place a configured feature from code."
migrate = "Additive: nothing to change. A wasm mod that calls it rebuilds against this SDK."

ids = ["method:WorldDrawContext::name_tag", "type:NameTagOptions", "handle:NameTagOptions::new", "type:DrawError", "type:DrawError.TextTooDeep", "type:DrawError.TextRefused"]
why = "Mods label places in the world (#4171): WorldDrawContext::name_tag draws text as vanilla's submitNameTag draws a name, 0.5 above a point, facing the camera, optionally see-through and on the player's text background, sharing the view's quad budget. DrawError gains TextTooDeep and TextRefused, so its wire layout changes for wasm mods."
migrate = "Nothing to change for native mods: DrawError is #[non_exhaustive]. A wasm mod rebuilds against this SDK."

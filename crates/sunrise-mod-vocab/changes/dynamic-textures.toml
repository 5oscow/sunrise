ids = [
    "method:prelude::ClientRenderClientHost::mod_image",
    "method:prelude::ClientRenderClientHost::upload_dynamic_texture",
    "method:prelude::ClientRenderClientHost::release_dynamic_texture",
    "type:DynamicTextureError",
]
why = "Client mods get run-time textures, vanilla's DynamicTexture in the TextureManager (#1343): ClientRenderClientHost::upload_dynamic_texture names an RGBA image under the mod's own namespace, makes it or replaces its pixels at any size, and DrawContext::sprite draws it by that id; release_dynamic_texture frees it. Each is a texture of its own, kept through a resource reload, several per mod, never reachable by another mod, within per-mod and total budgets refused by name (DynamicTextureError). ClientRenderClientHost::mod_image, one 1024 by 1024 GUI atlas slot shared by every mod, is removed with its atlas slot `sunrise/modimage`."
migrate = "Replace `host.mod_image(w, h, &rgba)` with `host.upload_dynamic_texture(&Identifier::parse(\"mymod:dynamic/image\")?, w, h, &rgba)` and draw `\"mymod:dynamic/image\"` with `DrawContext::sprite` instead of `sunrise/modimage`. Handle its `Result` (DynamicTextureError) instead of the bool, and release the texture with `release_dynamic_texture` when it is no longer drawn."

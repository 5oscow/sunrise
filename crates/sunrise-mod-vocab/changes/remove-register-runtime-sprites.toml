ids = ["hook:register_runtime_sprites", "type:RuntimeSprite", "hook:register_sprite_sources", "hook:sprite_source"]
why = "register_runtime_sprites and RuntimeSprite are removed: a second, Sunrise-only way to add sprites (a capped list of PNGs for the block and GUI atlases) beside the sprite sources every atlas definition runs. register_sprite_sources and sprite_source now also run in the GUI atlas (minecraft:gui), so a mod adds a GUI sprite as the pixels, or an alias or cut of a texture, of a registered source type with an entry in its assets/minecraft/atlases/gui.json. The GUI atlas's final list decides its sprites: a replacement, alias or generated sprite replaces the walked file of its id, a removed or filtered sprite is dropped, and `gui_sprite` and `DrawContext::sprite` find a sprite by its id (`minecraft:container/slot`, a mod's `mymod:panel`). Both hooks stay at version 2 from the previous change; their bump now also covers the GUI atlas being asked."
migrate = "Replace each RuntimeSprite push with a registered sprite source type: register it in register_sprite_sources, add an entry of that type to your assets/minecraft/atlases/blocks.json (block sprites) or gui.json (GUI sprites), and answer it in sprite_source with SpriteSourceOutput::Pixels for the sprite's id (a sprite id no longer carries the block/ or gui/ path prefix by rule, and there is no 128-sprite or 256-pixel cap). Then rebuild against this SDK."

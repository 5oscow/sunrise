why = "Version 2 runs on demand on both logical sides, for every registered tab. It exposes ordered parent/search edits before feature filtering. The world-scoped Host read uses an explicit permission profile and includes both ordered lists of every tab. Same-key reentrant reads see completed tabs and the prior contents of the remaining tabs; another key returns a typed refusal."
migrate = "Named injections request hook_version = 2. Match the hook's HostSide and edit its scoped handle with CreativeTabPlacement::Last and CreativeTabVisibility::Both instead of pushing to a client-only vector. Use ItemsHost::creative_tabs(CreativeTabPermissions::Normal) for membership, or Operator to request the operator build context. Use tab.contains(&stack) for exact search membership and tabs_showing(&stack) for display membership. Client inventory ranking uses the mutable WorldOnly creative_search_items method."

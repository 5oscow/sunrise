ids = ["method:Registrar::register_feature_type", "trait:FeatureType", "trait:FeatureContext", "type:FeatureError", "trait:FeaturesRegistrar"]
why = "Adds mod feature types (#953): Registrar::register_feature_type registers a FeatureType, vanilla's Feature with its own place, for configured features whose \"type\" names it. A mod feature runs through every route a built-in feature does (biome decoration on the worldgen workers, nested selectors, growth, bone meal, /place feature and LevelRef::place_feature) with the caller's world and random, in vanilla's placement order. Its config is the configured feature's JSON object as NBT, converted once at load. Tinkers' Construct's slime trees and blood fungus, Biomes O' Plenty's trees and other mods' Java Feature classes needed it; data packs could only name vanilla's feature types."
migrate = "Additive: nothing to change. A wasm mod that uses it rebuilds against this SDK."

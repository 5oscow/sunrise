# One-off release check on branch sunrise-release-cleaninstall only (never merged): a fresh GitHub-hosted Windows and
# Linux machine installs the published launcher, installs and prepares today's Nightly from Minecraft's files
# downloaded from Mojang (as a player's launcher keeps them), and runs the installed game into a new world.
# Nothing is uploaded: the prepared resources hold Mojang's data and never leave the runner.
name: clean install
on:
  push:
    branches: [sunrise-release-cleaninstall]
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            asset: sunrise-launcher-setup.exe
          - os: ubuntu-24.04
            asset: sunrise-launcher-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      LAUNCHER_TAG: launcher@1.0.1
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/clean-install
            tools/ci/with_xvfb.py
      - name: Download the published launcher and check it against its SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl" && cd "$RUNNER_TEMP/dl"
          base="https://github.com/sunrise-org/sunrise/releases/download/${LAUNCHER_TAG/@/%40}"
          curl -fsSLO "$base/${{ matrix.asset }}"
          curl -fsSLO "$base/SHA256SUMS"
          grep " ${{ matrix.asset }}\$" SHA256SUMS | sha256sum -c -
      - name: Install the launcher as a player does
        run: |
          set -euo pipefail
          home="${RUNNER_TEMP//\\//}/home"
          mkdir -p "$home"
          if [[ "$RUNNER_OS" == Windows ]]; then
            "$RUNNER_TEMP/dl/sunrise-launcher-setup.exe" setup --quiet --dir "$home/programs"
            launcher=$(find "$home/programs" -name 'sunrise-launcher.exe' | head -1)
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libvulkan1 mesa-vulkan-drivers libasound2t64 libxkbcommon-x11-0 libxcb-xkb1 >/dev/null
            mkdir -p "$home/programs" && tar xzf "$RUNNER_TEMP/dl/${{ matrix.asset }}" -C "$home/programs"
            launcher="$home/programs/sunrise-launcher"
          fi
          [[ -f "$launcher" ]] || { echo "::error::no launcher installed"; exit 1; }
          echo "LAUNCHER=$launcher" >> "$GITHUB_ENV"
          echo "H=$home" >> "$GITHUB_ENV"
          for v in SUNRISE_LAUNCHER_HOME=launcher SUNRISE_HOME=game XDG_DATA_HOME=data XDG_CONFIG_HOME=config \
                   SUNRISE_LAUNCHER_TRASH=trash SUNRISE_LAUNCHER_CLIPBOARD=clip SUNRISE_LAUNCHER_DESKTOP=desktop; do
            echo "${v%%=*}=$home/${v#*=}" >> "$GITHUB_ENV"
          done
          echo "SUNRISE_LAUNCHER_NO_SELF_UPDATE=1" >> "$GITHUB_ENV"
          echo "SUNRISE_NO_AUDIO=1" >> "$GITHUB_ENV"
          "$launcher" --version
      - name: Install the latest game (today's Nightly) with the launcher
        run: |
          set -euo pipefail
          retry() { for i in 1 2 3 4; do "$@" && return 0; sleep $((i * 15)); done; return 1; }
          retry "$LAUNCHER" versions | head -5
          retry "$LAUNCHER" install latest
          "$LAUNCHER" versions --installed
      - name: Minecraft 26.3 from Mojang, in the official launcher's layout
        run: |
          python=python3; [[ "$RUNNER_OS" != Windows ]] || python=python
          $python .github/clean-install/mojang_install.py "$H/.minecraft"
      - name: Prepare the game with the launcher
        run: |
          set -euo pipefail
          "$LAUNCHER" prepare --minecraft "$H/.minecraft" 2>&1 | tail -5
          "$LAUNCHER" versions --installed
      - name: Play asks for a Microsoft account
        run: |
          status=0
          out=$("$LAUNCHER" play --world smoke 2>&1) || status=$?
          echo "$out" | tail -2
          [[ $status != 0 ]] && grep -q "Sign in with a Microsoft account" <<<"$out"
      - name: The installed game enters a new world
        run: |
          set -euo pipefail
          version=$(ls "$SUNRISE_LAUNCHER_HOME/versions" | head -1)
          dir="$SUNRISE_LAUNCHER_HOME/versions/$version"
          client=$(ls "$dir"/sunrise-client "$dir"/sunrise-client.exe 2>/dev/null | head -1)
          # The game refuses resources inside the launcher's data folder without Play's lease: a copy outside it.
          cp -r "$dir/.local/sunrise-client/26.3" "$H/resources"
          mkdir -p "$H/gamedir" && cd "$H/gamedir"
          display=(); [[ "$RUNNER_OS" != Linux ]] || display=(python3 "$GITHUB_WORKSPACE/tools/ci/with_xvfb.py")
          status=0
          "${display[@]}" "$client" --resources "$H/resources" --offscreen --world smoke --seed 1 --render-distance 4 \
            --world-frames 1500 --timeout-seconds 900 --smoke-report "$H/smoke.json" > "$H/client.log" 2>&1 || status=$?
          echo "exit $status"; tail -5 "$H/client.log"
          python=python3; [[ "$RUNNER_OS" != Windows ]] || python=python
          $python - "$H/smoke.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print({k: r.get(k) for k in ("frames", "chunks", "meshed_sections", "player", "error", "adapter")})
          if r.get("error") is not None or r.get("frames", 0) < 1500 or not r.get("chunks") or not r.get("player"):
              sys.exit("the game did not draw a world")
          PY
  self-update:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            asset: sunrise-launcher-setup.exe
          - os: ubuntu-24.04
            asset: sunrise-launcher-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Launcher 1.0.0, installed as a player does, updates itself to the newest launcher
        run: |
          set -euo pipefail
          home="${RUNNER_TEMP//\\//}/home"; mkdir -p "$home/programs" && cd "$RUNNER_TEMP"
          base="https://github.com/sunrise-org/sunrise/releases/download/launcher%401.0.0"
          curl -fsSLO "$base/${{ matrix.asset }}"; curl -fsSLO "$base/SHA256SUMS"
          grep " ${{ matrix.asset }}\$" SHA256SUMS | sha256sum -c -
          if [[ "$RUNNER_OS" == Windows ]]; then
            "./${{ matrix.asset }}" setup --quiet --dir "$home/programs"
            launcher=$(find "$home/programs" -name 'sunrise-launcher.exe' | head -1)
          else
            tar xzf "${{ matrix.asset }}" -C "$home/programs"; launcher="$home/programs/sunrise-launcher"
          fi
          export SUNRISE_LAUNCHER_HOME="$home/launcher" SUNRISE_HOME="$home/game" XDG_DATA_HOME="$home/data" \
            XDG_CONFIG_HOME="$home/config" SUNRISE_LAUNCHER_TRASH="$home/trash" SUNRISE_LAUNCHER_CLIPBOARD="$home/clip" \
            SUNRISE_LAUNCHER_DESKTOP="$home/desktop"
          "$launcher" --version
          "$launcher" update --check
          "$launcher" update
          after=$("$launcher" --version); echo "after: $after"
          [[ "$after" == "sunrise-launcher 1.0.1" ]] || { echo "::error::the launcher did not update itself"; exit 1; }

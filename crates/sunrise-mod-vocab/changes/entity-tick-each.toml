ids = ["hook:entity_tick_pre", "hook:entity_tick_post", "hook:entity_tick_listened", "method:Hooks::entity_tick_pre", "method:Hooks::entity_tick_post", "method:Hooks::entity_tick_listened", "type:EntityTickPreEvent.entity", "type:EntityTickPreEvent.kind", "type:EntityTickPreEvent.cancelled", "type:EntityTickPostEvent.entity", "type:EntityTickPostEvent.kind", "hook:entity_tick_post.entity", "hook:entity_tick_post.kind"]
why = "entity_tick_pre and entity_tick_post version 2 are told at NeoForge's EntityTickEvent timing, right before and right after each entity's own tick, for minecarts, boats and general entity rows, and on the server for the mobs and item entities of a type a mod names with Registrar::entity_tick_each (or every type, entity_tick_each_entity); the other mobs and item entities, the server's projectiles and a client's mobs, players, projectiles and tridents are told once for each family. Both events now hold a list: the ids (entities) and their types (kinds, one for each id), one id when the entity is told alone. A Pre listener cancels an entity's tick by pushing its id onto canceled, a collect, instead of returning Flow::Cancel. The three entity tick hooks, entity_tick_listened included, fire on the server and on a client, so they take a HostSide."
migrate = "Rebuild against this SDK. Take a HostSide where the listener took a ServerHost (match HostSide::Server for server-only work). Loop over event.entities with event.kinds beside it where the listener read event.entity and event.kind, push the ids the Pre cancels onto event.canceled, and return nothing. A mod that needs an entity's own moment, as a port of a NeoForge EntityTickEvent listener does, calls r.entity_tick_each(type) in register, or r.entity_tick_each_entity() for every type."

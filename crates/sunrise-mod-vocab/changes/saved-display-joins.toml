ids = ["hook:entity_join_level"]
why = "Hook version 3 notifies for every entity that joins a level, including displays, markers, interactions, eyes of ender and leash knots. loaded_from_disk is set when its chunk restores it. Saved data kept for a missing mod is not an entity in the level and does not notify."
migrate = "Listeners should handle these additional entity kinds; loaded_from_disk distinguishes chunk reloads. LevelRef::entities_in additionally returns readable handles for block displays, item displays, text displays, markers and interactions, but not yet eyes of ender, leash knots or other unmodeled kinds."

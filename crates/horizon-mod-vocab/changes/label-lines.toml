ids = ["method:DrawContext::text_lines", "type:TextLines", "type:TextLine", "type:TextAlign"]
why = "a label could be measured one line at a time and drawn one line at a time, so wrapping a paragraph meant re-implementing vanilla's Font.split in every mod; Text is the most used BlockUI element (342 tags in 86 of MineColonies' 94 XML files) and alignment appears in 73 of them. text_lines answers the wrap, the place of each line and the block's height, through the engine's own split_formatted, and imposes no widget or theme. It is new surface, not a change to an old one: nothing is removed or renamed, and every existing call keeps its meaning."
migrate = "A mod that measured one line with text_width and wrapped the text itself can ask host.text_lines(&text, max_width, TextAlign::Left, 0.0) and draw each TextLine at its at with DrawContext::text, then size a scroll container from TextLines::height. Rebuild native and wasm mods against the updated SDK; no old call changes."

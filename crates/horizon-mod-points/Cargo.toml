[package]
name = "horizon-mod-points"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Typed SDK point listener constructors, using the game's canonical records"

[lib]
name = "mod_points"

[features]
listener-fixture = ["horizon-mod-api-gen/listener-fixture", "horizon-game-points/listener-fixture"]
wasm-guest = ["horizon-mod-api/wasm-guest", "horizon-game-points/wasm-guest"]

[dependencies]
horizon-mod-api = { path = "../horizon-mod-api" }
horizon-engine-slots = { path = "../horizon-engine-slots" }
horizon-game-points = { path = "../horizon-game-points" }

[build-dependencies]
horizon-mod-api-gen = { path = "../horizon-mod-api-gen" }

[dev-dependencies]
horizon-mod-api = { path = "../horizon-mod-api", features = ["testing"] }
horizon-mod-api-macros = { path = "../horizon-mod-api-macros" }
serde_json = "1"

[[test]]
name = "registry"
required-features = ["listener-fixture"]

[[test]]
name = "replace"
required-features = ["listener-fixture"]

[[test]]
name = "order"
required-features = ["listener-fixture"]


[lints]
workspace = true

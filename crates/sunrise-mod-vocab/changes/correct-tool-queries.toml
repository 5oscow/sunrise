ids = ["host:block_state_correct_tool_for_drops", "host:player_has_correct_tool_for_drops", "handle:PlayerRef::has_correct_tool_for_drops", "handle:BlockStates::is_correct_tool_for_drops"]
why = "Adds two read-only queries: whether a stack's tool rules make it the correct tool for a block state, and whether a player's selected tool harvests a state at a position in a level, the answer dig progress, drops and doors use (vanilla's rule, the block's can_harvest_block parts, then player_harvest_check). The player query runs those hooks."
migrate = "Additive. Use the stack query for the tool alone; use the player query for what the game decides, from a context that may run hooks, and guard a player_harvest_check listener against calling it from itself."

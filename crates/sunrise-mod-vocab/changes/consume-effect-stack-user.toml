ids = ["hook:consume_effect", "method:Hooks::consume_effect", "type:ConsumeEffectEvent"]
why = "consume_effect version 2 supplies the consumed stack snapshot and the consuming entity, and fires for mobs as well as players. The effective stack consumable determines the effect list."
migrate = "Request hook_version = 2. Read event.stack for components and event.user for the consuming entity instead of assuming the acting player is the consumer."

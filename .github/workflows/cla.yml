name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # Copies of upstream pull requests (branches upstream/pr-N, pushed only by the mirror) and merges of arismoko/horizon
    # (branches sync/arismoko-*, pushed only by organization members) bring MIT code that its authors never submitted
    # to Sunrise, so they need no CLA. Both must come from this repository, not from a fork.
    if: >-
      (github.event_name == 'pull_request_target'
          && !((startsWith(github.event.pull_request.head.ref, 'upstream/pr-')
                || startsWith(github.event.pull_request.head.ref, 'sync/arismoko-'))
               && github.event.pull_request.head.repo.full_name == github.repository))
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request
          && (github.event.comment.body == 'recheck'
              || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/sunrise-org/sunrise/blob/main/CLA.md
          branch: cla-signatures
          allowlist: sunrise-sunny[bot],dependabot[bot]

ids = ["type:StartRidingRefusal", "handle:EntityRef::try_start_riding"]
why = "Adds EntityRef::try_start_riding beside EntityRef::start_riding (#4456 part 1): the same mount and checks, with each refusal named instead of a bare false: NoEntity (a removed, held-out or other-level handle), PlayerVehicle (vanilla refuses a vehicle whose type is not saved, the player type, before it reads force), UnsupportedRider, UnsupportedVehicle, SameEntity, AlreadyRiding, Cycle, CannotRide, Full and Canceled (entity_mount, which fires after every other refusal). start_riding keeps its bool and its behaviour."
migrate = "Nothing to change: start_riding keeps its signature. A mod that wants the cause calls try_start_riding and matches StartRidingRefusal with a wildcard arm, since the enum is non_exhaustive."

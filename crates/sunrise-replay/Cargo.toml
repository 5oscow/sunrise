[package]
name = "sunrise-replay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Replay archive format, packet recording and playback for Sunrise"

[dependencies]
sunrise-core = { path = "../sunrise-core" }
sunrise-hooks = { path = "../sunrise-hooks" }
sunrise-protocol = { path = "../sunrise-protocol" }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
crc32fast = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true

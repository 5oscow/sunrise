ids = ["hook:register_load_conditions"]
why = "register_load_conditions version 2 allows registration in any namespace, matching condition type registration. Built-in and duplicate IDs refuse mod load. Foreign registrations do not own a condition namespace or change its unknown-ID handling."
migrate = "Named injections request hook_version = 2. Registrants may use another namespace without a wrapper or alias; each full id still has exactly one handler."

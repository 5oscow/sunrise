ids = ["method:PlayerRef::give_stack", "method:PlayerRef::drop_stack", "method:PlayerRef::destroy_block"]
why = "A mod's write to a player in another level than the hook's (#2875) put what lands in the world into the hook's level: overflow and throws at the player's coordinates there, or the break. Inventory and data writes still apply at once wherever the player is; what would land in the world does not happen. give_stack now returns what did not fit for such a player instead of dropping it, so it returns Result<Option<ItemStack>, PlayerDataRefusal>; drop_stack returns the stack; destroy_block breaks nothing. No pickup or equip sound plays for that player."
migrate = "give_stack's Ok value is now Option<ItemStack>: None when everything was given (always, for a player in the hook's level), Some(rest) for the part a player in another level had no room for. Drop it from a hook in that player's level, or keep it. A wasm mod rebuilds against this SDK."

ids = ["hook:client_frame_pick", "type:ClientFramePickEvent", "type:ClientTargeting", "method:prelude::ClientViewClientHost::targeting", "method:prelude::ClientViewClientHost::set_targeting"]
why = "Replaces persistent client targeting flags and entity overrides with one client_frame_pick decision per frame, at the frame's partial tick before render-state extraction. Highlight and subsequent input ticks share the committed result. The new hook starts at version 1."
migrate = "Delete ClientTargeting and calls to targeting/set_targeting. Subscribe to client_frame_pick and replace event.result; use the supplied block candidate for blocks-first selection. Reach stays attribute-backed. Item-specific rays and server validation remain unchanged."
